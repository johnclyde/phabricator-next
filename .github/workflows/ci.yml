name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, and browser tests
    # Standard hosted Linux runners are free for public repositories.
    runs-on: ubuntu-24.04
    # Both mount configurations run the complete desktop/mobile suite.
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Run core tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests
        run: npm run test:e2e

      - name: Build under a path prefix
        run: npm run build
        env:
          APP_BASE_PATH: /workspace/

      - name: Run browser tests under a path prefix
        run: npm run test:e2e
        env:
          APP_BASE_PATH: /workspace/

  local-transcription:
    name: Real browser transcription without network access
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_REAL_TRANSCRIPTION: '1'
      APP_TRANSCRIPTION_MODEL_DIR: ${{ github.workspace }}/.data/transcription-model
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Stage digest-verified public model
        run: npm run transcription:model -- --directory "$APP_TRANSCRIPTION_MODEL_DIR"
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Verify real offline transcription on desktop and mobile
        run: npm run test:e2e -- tests/transcription-real.spec.ts tests/transcription-session.spec.ts tests/transcript-source-real.spec.ts
      - name: Build under a path prefix
        run: npm run build
        env:
          APP_BASE_PATH: /workspace/
      - name: Verify real offline transcription under a path prefix
        run: npm run test:e2e -- tests/transcription-real.spec.ts tests/transcription-session.spec.ts tests/transcript-source-real.spec.ts
        env:
          APP_BASE_PATH: /workspace/

  paper-compiler:
    name: Real isolated paper compiler and PDF workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      PHABRICATOR_TEX_DOCKER_SOCKET: /var/run/docker.sock
      PHABRICATOR_TEX_WORK_DIR: ${{ github.workspace }}/.data/tex-worker
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Prepare digest-verified public TeX toolchain
        run: python3 worker/tex/prepare.py --directory .data/tex-toolchain --architecture x86_64 --discard-downloads

      - name: Build and pin the isolated compiler image
        run: |
          TEX_BUNDLE_DIGEST="$(node --import tsx --input-type=module -e 'import { TEX_BUNDLE_SHA256 } from "./server/tex-runner.ts"; console.log(TEX_BUNDLE_SHA256)')"
          docker build --build-arg "BUNDLE_SHA256=$TEX_BUNDLE_DIGEST" --tag phabricator-tex:ci .data/tex-toolchain/image
          TEX_IMAGE_DIGEST="$(docker image inspect phabricator-tex:ci --format '{{.Id}}')"
          echo "PHABRICATOR_TEX_IMAGE=$TEX_IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Verify real compilation, reproducibility and isolation limits
        run: node --import tsx --test server/tex-runner.test.ts
        env:
          PHABRICATOR_TEX_INTEGRATION: '1'

      - name: Build PDF interface
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Compile and navigate real papers on desktop and mobile
        run: npm run test:e2e -- tests/paper-build-real.spec.ts
        env:
          E2E_REAL_TEX: '1'

      - name: Build PDF interface under a path prefix
        run: npm run build
        env:
          APP_BASE_PATH: /workspace/

      - name: Verify real PDFs under a path prefix
        run: npm run test:e2e -- tests/paper-build-real.spec.ts
        env:
          E2E_REAL_TEX: '1'
          APP_BASE_PATH: /workspace/
