name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, and browser tests
    # Standard hosted Linux runners are free for public repositories.
    runs-on: ubuntu-24.04
    # Both mount configurations run the complete desktop/mobile suite.
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Run core tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests
        run: npm run test:e2e

      - name: Build under a path prefix
        run: npm run build
        env:
          APP_BASE_PATH: /workspace/

      - name: Run browser tests under a path prefix
        run: npm run test:e2e
        env:
          APP_BASE_PATH: /workspace/
